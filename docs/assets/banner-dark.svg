<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Ferrum Field Service: Work orders from request to invoice: scheduling, dispatch, parts, checklists and signatures on site.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#2c1a1c"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b15549"/><stop offset="1" stop-color="#99392c"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#a63e30" fill-opacity="0.16"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#a63e30" flood-opacity="0.45"/></filter>
    <clipPath id="card"><rect width="1280" height="360" rx="28"/></clipPath>
    <style>
      text { font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .sheen { animation: sweep 9s ease-in-out infinite; }
      .tile { animation: float 7s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-480px) skewX(-18deg); } 60%, 100% { transform: translateX(1760px) skewX(-18deg); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @media (prefers-reduced-motion: reduce) { .sheen, .tile { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#dots)"/>
    <circle cx="1150" cy="20" r="230" fill="#a63e30" fill-opacity="0.1"/>
    <circle cx="1240" cy="350" r="150" fill="#a63e30" fill-opacity="0.08"/>
    <rect class="sheen" x="0" y="-60" width="260" height="480" fill="url(#sheen)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="28" fill="none" stroke="#30363d"/>
  <g class="tile"><g transform="translate(72 102)" filter="url(#shadow)"><rect width="144" height="144" rx="36" fill="url(#tile)"/><g transform="translate(36 36) scale(3)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></g></g></g>
  <text x="264" y="138" font-size="17" font-weight="700" fill="#ca8b83" letter-spacing="2.4">FERRUM APP</text>
  <text x="262" y="198" font-size="58" font-weight="750" fill="#e6edf3" letter-spacing="-1">Ferrum Field Service</text>
  <text x="264" y="244" font-size="23" fill="#9da7b3">Work orders from request to invoice: scheduling, dispatch,</text>
  <text x="264" y="278" font-size="23" fill="#9da7b3">parts, checklists and signatures on site.</text>
  <g><rect x="264" y="310" width="70" height="30" rx="15" fill="#381e1e"/><text x="298.8" y="330" font-size="14.5" font-weight="600" fill="#ce958d" text-anchor="middle">v0.1.1</text></g>
  <g><rect x="343.6" y="310" width="147" height="30" rx="15" fill="#381e1e"/><text x="417.1" y="330" font-size="14.5" font-weight="600" fill="#ce958d" text-anchor="middle">Records screens</text></g>
  <g><rect x="500.6" y="310" width="87" height="30" rx="15" fill="#381e1e"/><text x="544.0" y="330" font-size="14.5" font-weight="600" fill="#ce958d" text-anchor="middle">AGPL-3.0</text></g>
</svg>
