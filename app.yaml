id: field-service
name: Field Service
version: 0.2.0
publisher: cbferrum
summary: "Field service: service requests, work orders, technician scheduling and dispatch, parts and time, checklists, signatures and invoicing"
description: README.md
categories: [support, inventory]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-field-service
support: https://github.com/CBFerrum/ferrum-app-field-service/issues
runtime: native
platform: ">=0.3.2, <0.4"
# Records of ERP (items, customers, accounts, stock): installing it installs ERP.
requires: {erp: ">=0.1"}
packages: [field_service]
uninstall: ask
# Its own interface at /field-service/ (Ferrum docs/plan/apps-ui.md §13): the dispatch board, a
# technician's day and the job they are on, a work order's page, and its records in lists and forms
# (ui/, built into ui/dist).
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: field_service
      route: field-service
      title: Field Service
      description: Dispatch the day, work the jobs, follow each work order
      icon: wrench
      color: "#a63e30"
      roles: [Dispatcher, Service Manager, Technician]
  shell.open:
    # A work order opens on its own page; Field Service's other records in its forms and lists.
    - {id: work_order, entity: ServiceWorkOrder, path: "field-service/w/{id}", list: "field-service/e/ServiceWorkOrder", priority: 1}
    - {id: field_service, package: field_service, path: "field-service/e/{entity}/{id}", list: "field-service/e/{entity}"}
  shell.create:
    - {id: work_order, label: Work order, path: field-service/e/ServiceWorkOrder/new, entity: ServiceWorkOrder}
    - {id: request, label: Service request, path: field-service/e/ServiceRequest/new, entity: ServiceRequest}
